<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>copiloto-n1 web</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --border: #d7dfeb;
        --text: #1f2937;
        --muted: #52607a;
        --primary: #1d4ed8;
        --primary-strong: #153bb8;
        --danger: #b91c1c;
        --success: #166534;
        --shadow: rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 12px 30px var(--shadow);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .sub {
        margin: 0 0 20px;
        color: var(--muted);
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover { filter: brightness(0.98); }
      button:active { transform: translateY(1px); }

      #recordButton {
        background: var(--primary);
        color: white;
        min-width: 140px;
      }

      #copyButton {
        background: #eef2ff;
        color: var(--primary-strong);
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }

      #statusText {
        font-size: 14px;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
        font: 14px/1.5 "Segoe UI", Tahoma, sans-serif;
        padding: 12px;
      }

      .error-box {
        display: none;
        margin-top: 14px;
        background: #fff1f2;
        color: var(--danger);
        border: 1px solid #fecdd3;
        border-radius: 10px;
        padding: 12px;
        font-size: 13px;
        white-space: pre-wrap;
      }

      .error-box.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>copiloto-n1</h1>
      <p class="sub">ok · Grave o microfone e envie para transcrição.</p>

      <div class="controls">
        <button id="recordButton" type="button">Gravar</button>
        <button id="copyButton" type="button">Copiar texto</button>
      </div>

      <div class="status">
        <span id="statusText">Pronto</span>
      </div>

      <textarea id="transcript" aria-label="Transcrição" placeholder="A transcrição aparecerá aqui..."></textarea>
      <div id="errorBox" class="error-box" aria-live="polite"></div>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
