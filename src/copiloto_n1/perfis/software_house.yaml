# Perfil "software house / ERP".
# Regras de qualidade do chamado vivem aqui, não no código.
#
# Cada campo tem:
#   id          nome do campo em Chamado
#   rotulo      nome amigável
#   peso        importância na nota (a nota é proporcional ao que se aplica ao chamado)
#   severidade  bloqueante | importante | sugestao
#   quando      "sempre" ou "campo=valor1|valor2" (ex.: tipo=bug, status=escalado|resolvido)
#   validador   presenca | verdadeiro | booleano_definido | lista | cnpj | telefone | titulo | email
#   pergunta    o que o analista pode perguntar/fazer para resolver a pendência

nome: software_house
descricao: Suporte N1 de software house que atende clientes de ERP/PDV (CNPJ, versão, módulo, base de teste).

# SLA em horas por prioridade. Varia por contrato; ajuste ao seu caso.
sla_horas:
  alta: 4
  media: 24
  baixa: 72

titulo:
  min_caracteres: 15
  min_palavras: 3
  genericos:
    - problema
    - erro
    - duvida
    - dúvida
    - ajuda
    - suporte
    - chamado
    - teste
    - sistema

# Palavras que sugerem erro; usadas no aviso "marcado como dúvida mas parece bug".
palavras_de_erro:
  - erro
  - falha
  - travou
  - trava
  - travando
  - não abre
  - nao abre
  - não funciona
  - nao funciona
  - não consigo
  - nao consigo
  - parou
  - exceção

campos:
  # --- Identificação ---
  - id: contato_nome
    rotulo: Nome do contato
    peso: 8
    severidade: bloqueante
    pergunta: "Com quem eu estou falando? Qual é o seu nome?"

  - id: empresa
    rotulo: Empresa
    peso: 8
    severidade: bloqueante
    pergunta: "Qual é o nome da empresa (razão social ou nome fantasia)?"

  - id: cnpj
    rotulo: CNPJ
    peso: 6
    severidade: importante
    validador: cnpj
    pergunta: "Pode me passar o CNPJ da empresa? Vou confirmar aqui com você."

  - id: telefone
    rotulo: Telefone de retorno
    peso: 8
    severidade: bloqueante
    validador: telefone
    pergunta: "Qual o melhor telefone para retorno? Deixa eu repetir para confirmar."

  - id: email
    rotulo: E-mail
    peso: 1
    severidade: sugestao
    validador: email
    pergunta: "Qual e-mail posso usar para enviar o resumo ou o passo a passo?"

  # --- Classificação ---
  - id: titulo
    rotulo: Título
    peso: 8
    severidade: bloqueante
    validador: titulo
    pergunta: "Resuma em uma frase: o que acontece, onde e qual o efeito para o cliente."

  - id: tipo
    rotulo: Tipo
    peso: 6
    severidade: bloqueante
    pergunta: "É uma dúvida, um erro do sistema (bug), uma melhoria ou uma customização?"

  - id: prioridade
    rotulo: Prioridade
    peso: 5
    severidade: importante
    pergunta: "O sistema está parado ou existe alguma alternativa para o cliente continuar?"

  # --- Contexto técnico ---
  - id: descricao
    rotulo: Descrição
    peso: 8
    severidade: bloqueante
    pergunta: "O que exatamente acontece? Aparece alguma mensagem de erro?"

  - id: modulo
    rotulo: Módulo/tela
    peso: 4
    severidade: importante
    pergunta: "Em qual módulo ou tela isso acontece?"

  - id: quando_comecou
    rotulo: Quando começou
    peso: 4
    severidade: importante
    pergunta: "Quando começou? Foi agora ou já faz um tempo?"

  - id: recorrente
    rotulo: Recorrência
    peso: 3
    severidade: sugestao
    validador: booleano_definido
    pergunta: "Acontece sempre ou foi só uma vez?"

  - id: mudanca_recente
    rotulo: Mudança recente
    peso: 4
    severidade: importante
    pergunta: "Houve atualização, instalação ou alguma mudança recente? (Se não, registre 'nenhuma'.)"

  - id: escopo
    rotulo: Abrangência
    peso: 3
    severidade: importante
    pergunta: "Acontece em um computador só ou em vários?"

  # --- Específico de bug ---
  - id: versao
    rotulo: Versão do sistema
    peso: 4
    severidade: importante
    quando: tipo=bug
    pergunta: "Qual a versão do sistema? (Confira se é a última.)"

  - id: evidencias
    rotulo: Evidências (print/vídeo/log)
    peso: 6
    severidade: importante
    quando: tipo=bug
    validador: lista
    pergunta: "Consegue enviar um print ou gravar a tela quando o erro aparece?"

  - id: passos_reproducao
    rotulo: Passos para reproduzir
    peso: 6
    severidade: importante
    quando: tipo=bug
    validador: lista
    pergunta: "Quais passos você faz até aparecer o erro? Um por um, por favor."

  - id: reproduzido_base_teste
    rotulo: Reproduzido na base de teste
    peso: 4
    severidade: importante
    quando: tipo=bug
    validador: booleano_definido
    pergunta: "Consegui reproduzir na minha base de teste, na mesma versão do cliente?"

  - id: dependencias_externas
    rotulo: Dependências externas
    peso: 2
    severidade: sugestao
    quando: tipo=bug
    pergunta: "Rede, servidor ou alguma integração pode estar envolvido?"

  # --- Desfecho ---
  - id: causa_raiz
    rotulo: Causa raiz
    peso: 4
    severidade: importante
    quando: status=resolvido
    pergunta: "Qual foi a causa? Pergunte 'por quê' até chegar na origem (5 porquês)."

  - id: solucao
    rotulo: Solução aplicada
    peso: 8
    severidade: bloqueante
    quando: status=resolvido
    pergunta: "O que foi feito para resolver? Registre o passo a passo ou o script usado."

  - id: destino_escalonamento
    rotulo: Destino do escalonamento
    peso: 8
    severidade: bloqueante
    quando: status=escalado
    pergunta: "Para quem vai? (N2, N3, comercial, implantação, desenvolvimento)"

  - id: retorno_ao_cliente_feito
    rotulo: Cliente informado
    peso: 4
    severidade: importante
    quando: status=resolvido|escalado
    validador: verdadeiro
    pergunta: "Já avisei o cliente da solução ou do próximo passo e do prazo?"
